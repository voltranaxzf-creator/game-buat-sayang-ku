<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4/4 - Pesan Terakhir 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}
        body {
            background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 50%,#fad0c4 100%);
            min-height:100vh; padding:20px; font-family:'Quicksand', sans-serif;
            overflow-x:hidden;
        }
        .container {
            max-width:800px; margin:0 auto; background:rgba(255,255,255,0.92);
            border-radius:24px; padding:35px; box-shadow:0 12px 35px rgba(214,51,108,0.15);
        }
        .urutan {text-align:center; color:#b02a58; font-weight:500; margin-bottom:25px; font-size:16px; letter-spacing:1px;}
        h2 {text-align:center; margin-bottom:30px; color:#d6336c; font-family:'Great Vibes', cursive; font-size:36px; font-weight:normal;}
        textarea {width:100%; min-height:150px; padding:20px; border:2px solid #ffb3c1; border-radius:16px; font-size:18px; resize:vertical; background:rgba(255,255,255,0.8); font-family:'Quicksand', sans-serif; color:#7a3b64; line-height:1.8;}
        .kotak-pesan {margin-top:25px; padding:25px; background:rgba(255,240,245,0.8); border-radius:20px; font-size:20px; text-align:center; line-height:2; color:#7a3b64; border:1px solid rgba(255,179,193,0.5);}
        .kotak-pesan p {font-family:'Great Vibes', cursive; font-size:28px; color:#c2255c; font-weight:normal;}
        button {display:block; margin:15px auto; padding:14px 40px; border-radius:50px; background:linear-gradient(135deg,#ff6b81,#ff4757); color:white; border:none; font-weight:600; cursor:pointer; transition:0.2s ease; font-family:'Quicksand', sans-serif; font-size:17px; box-shadow:0 5px 15px rgba(255,71,87,0.3);}
        button:active {transform:scale(0.95);}
        .selesai {margin-top:35px; text-align:center; font-size:20px; color:#d6336c; font-weight:600; font-family:'Great Vibes', cursive;}
        .hati {position:fixed; font-size:22px; color:#ff4757; animation:jatuh 5s linear infinite; pointer-events:none; opacity:0.7;}
        @keyframes jatuh {0%{transform:translateY(-10px) rotate(0deg); opacity:0.7;} 100%{transform:translateY(100vh) rotate(360deg); opacity:0;}}
        .emoji-efek {
            position:fixed; font-size:24px; pointer-events:none; z-index:999;
            animation:melayang 1.2s ease-out forwards;
        }
        @keyframes melayang {
            0% {opacity:1; transform:translate(0,0) scale(0.5);}
            50% {opacity:1; transform:translate(var(--tx),var(--ty)) scale(1.2);}
            100% {opacity:0; transform:translate(var(--tx),calc(var(--ty) - 50px)) scale(0.8) rotate(360deg);}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="urutan">Langkah 4 dari 4 - Selesai 💖</div>
    <h2>Pesan Khusus Buat Kamu 💌</h2>

    <textarea id="pesan">Sayangku tercinta, terima kasih sudah mau menemani aku sampai di sini ya. Kamu adalah hal terindah yang pernah Tuhan berikan buat aku. Aku janji akan selalu sayang, menjaga, dan menemani kamu sampai kapanpun. Aku cinta kamu selamanya! ❤️</textarea>
    <button onclick="munculEfek(event); simpan()">Simpan Pesan</button>

    <div class="kotak-pesan">
        <p id="tampil"></p>
    </div>

    <div class="selesai">
        ✅ Ini halaman terakhir ya sayang! Aku sayang kamu selamanya 😘
    </div>
</div>

<script>
const emojiBagus = ['💖','✨','🥰','💫','🌸','💝','🎀','🦋','🌷','🧸','💌','🍓','🎈','🎊','💗','💓','💞','🌺','🐇','☁️'];

function munculEfek(e){
    let rect = e.target.getBoundingClientRect();
    let xPusat = rect.left + rect.width/2;
    let yPusat = rect.top + rect.height/2;
    
    for(let i=0; i<30; i++){
        let em = document.createElement('div');
        em.classList.add('emoji-efek');
        em.textContent = emojiBagus[Math.floor(Math.random()*emojiBagus.length)];
        em.style.left = xPusat + 'px';
        em.style.top = yPusat + 'px';
        let tx = (Math.random()-0.5)*300;
        let ty = (Math.random()-0.5)*300;
        em.style.setProperty('--tx', tx+'px');
        em.style.setProperty('--ty', ty+'px');
        document.body.appendChild(em);
        setTimeout(()=>em.remove(), 1200);
    }
}

function simpan(){localStorage.setItem("pesan", document.getElementById('pesan').value); tampil(); alert("Sudah disimpan ya sayang! 😘");}
function tampil(){
    let s=localStorage.getItem("pesan");
    if(s){
        document.getElementById('tampil').textContent=s;
        document.getElementById('pesan').value=s;
    } else {
        document.getElementById('tampil').textContent="Sayangku tercinta, terima kasih sudah mau menemani aku sampai di sini ya. Kamu adalah hal terindah yang pernah Tuhan berikan buat aku. Aku janji akan selalu sayang, menjaga, dan menemani kamu sampai kapanpun. Aku cinta kamu selamanya! ❤️";
    }
}
tampil();

setInterval(()=>{let h=document.createElement("div"); h.classList.add("hati"); h.textContent="❤️"; h.style.left=Math.random()*100+"vw"; document.body.appendChild(h); setTimeout(()=>h.remove(),7000);},800);
</script>
</body>
</html>
