<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2/4 - Main Yuk 🎮</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}
        body {
            background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 50%,#fad0c4 100%);
            min-height:100vh; padding:20px; font-family:'Quicksand', sans-serif;
            overflow-x:hidden;
        }
        .container {
            max-width:800px; margin:0 auto; background:rgba(255,255,255,0.92);
            border-radius:24px; padding:35px; box-shadow:0 12px 35px rgba(214,51,108,0.15);
        }
        .urutan {text-align:center; color:#b02a58; font-weight:500; margin-bottom:25px; font-size:16px; letter-spacing:1px;}
        h2 {text-align:center; margin-bottom:25px; color:#d6336c; font-family:'Great Vibes', cursive; font-size:36px; font-weight:normal;}
        h3 {font-family:'Great Vibes', cursive; font-size:26px; color:#c2255c; margin-bottom:15px; font-weight:normal;}
        p {line-height:1.8; text-align:center; margin-bottom:15px; font-size:18px; color:#7a3b64; font-weight:500;}
        .kotak {background:rgba(255,240,245,0.8); border-radius:20px; padding:25px; margin:20px 0; text-align:center; border:1px solid rgba(255,179,193,0.5);}
        input {padding:12px 18px; margin:8px; border-radius:12px; border:2px solid #ffb3c1; font-size:17px; font-family:'Quicksand', sans-serif; background:rgba(255,255,255,0.8);}
        button {padding:12px 22px; margin:8px; border-radius:12px; background:linear-gradient(135deg,#ff6b81,#ff4757); color:white; border:none; cursor:pointer; font-weight:600; transition:0.2s ease; font-family:'Quicksand', sans-serif; font-size:16px;}
        button:active {transform:scale(0.95);}
        #tombol-hati {font-size:45px; padding:25px; border-radius:50%; width:120px; height:120px;}
        .tombol-bawah {display:flex; justify-content:center; margin-top:35px;}
        .hati {position:fixed; font-size:22px; color:#ff4757; animation:jatuh 5s linear infinite; pointer-events:none; opacity:0.7;}
        @keyframes jatuh {0%{transform:translateY(-10px) rotate(0deg); opacity:0.7;} 100%{transform:translateY(100vh) rotate(360deg); opacity:0;}}
        .emoji-efek {
            position:fixed; font-size:24px; pointer-events:none; z-index:999;
            animation:melayang 1.2s ease-out forwards;
        }
        @keyframes melayang {
            0% {opacity:1; transform:translate(0,0) scale(0.5);}
            50% {opacity:1; transform:translate(var(--tx),var(--ty)) scale(1.2);}
            100% {opacity:0; transform:translate(var(--tx),calc(var(--ty) - 50px)) scale(0.8) rotate(360deg);}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="urutan">Langkah 2 dari 4</div>
    <h2>Main Sebentar Yuk Sayang! 🎮</h2>

    <div class="kotak">
        <h3>🎯 Tebak Angka 1-20</h3>
        <input type="number" id="input-tebak" min="1" max="20" placeholder="Isi di sini...">
        <br>
        <button onclick="munculEfek(event); cekTebak()">Tebak!</button>
        <div id="hasil-tebak" style="margin-top:12px; font-weight:600; color:#c2255c;"></div>
    </div>

    <div class="kotak">
        <h3>❤️ Ketuk Hati Cepat!</h3>
        <button id="tombol-hati" onclick="munculEfek(event); tambah()">💖</button>
        <p>Skor: <span id="skor" style="font-weight:600; font-size:20px;">0</span></p>
        <button onclick="munculEfek(event); mulai()">Mulai 5 Detik!</button>
        <div id="hasil-klik" style="margin-top:12px; font-weight:600; color:#c2255c;"></div>
    </div>

    <div class="tombol-bawah">
        <button onclick="munculEfek(event); setTimeout(()=>window.location.href='tebak.html', 1000)">Lanjut →</button>
    </div>
</div>

<script>
const emojiBagus = ['💖','✨','🥰','💫','🌸','💝','🎀','🦋','🌷','🧸','💌','🍓','🎈','🎊','💗','💓','💞','🌺','🐇','☁️'];

function munculEfek(e){
    let rect = e.target.getBoundingClientRect();
    let xPusat = rect.left + rect.width/2;
    let yPusat = rect.top + rect.height/2;
    let jumlah = e.target.id==='tombol-hati' ? 12 : 22;
    
    for(let i=0; i<jumlah; i++){
        let em = document.createElement('div');
        em.classList.add('emoji-efek');
        em.textContent = emojiBagus[Math.floor(Math.random()*emojiBagus.length)];
        em.style.left = xPusat + 'px';
        em.style.top = yPusat + 'px';
        let tx = (Math.random()-0.5)*250;
        let ty = (Math.random()-0.5)*250;
        em.style.setProperty('--tx', tx+'px');
        em.style.setProperty('--ty', ty+'px');
        document.body.appendChild(em);
        setTimeout(()=>em.remove(), 1200);
    }
}

let angka=Math.floor(Math.random()*20)+1;
function cekTebak(){
    let t=parseInt(document.getElementById('input-tebak').value);
    let h=document.getElementById('hasil-tebak');
    if(isNaN(t)) h.textContent="Isi dulu ya sayang!";
    else if(t<angka) h.textContent="Masih kecil sedikit lagi 😉";
    else if(t>angka) h.textContent="Kebesaran sayang 😊";
    else {h.textContent="BENAR! Kamu hebat banget ❤️"; angka=Math.floor(Math.random()*20)+1;}
}

let skor=0, sisa=5, jalan=false;
function tambah(){if(!jalan)return; skor++; document.getElementById('skor').textContent=skor;}
function mulai(){
    if(jalan)return; skor=0; sisa=5; jalan=true;
    document.getElementById('skor').textContent=skor; document.getElementById('hasil-klik').textContent="";
    let hitung=setInterval(()=>{
        sisa--; if(sisa<=0){clearInterval(hitung); jalan=false;
        document.getElementById('hasil-klik').textContent=`Selesai! ${skor} kali ketuk, secepat detak jantungku saat lihat kamu ❤️`;}
    },1000);
}

setInterval(()=>{let h=document.createElement("div"); h.classList.add("hati"); h.textContent="❤️"; h.style.left=Math.random()*100+"vw"; document.body.appendChild(h); setTimeout(()=>h.remove(),7000);},800);
</script>
</body>
</html>
