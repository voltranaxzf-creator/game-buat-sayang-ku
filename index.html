<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1/4 - Buat Kamu Sayang ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}
        body {
            background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 50%,#fad0c4 100%);
            min-height:100vh; padding:20px; font-family:'Quicksand', sans-serif;
            overflow-x:hidden;
        }
        .container {
            max-width:800px; margin:0 auto; background:rgba(255,255,255,0.92);
            border-radius:24px; padding:45px 35px; box-shadow:0 12px 35px rgba(214,51,108,0.15);
        }
        .urutan {text-align:center; color:#b02a58; font-weight:500; margin-bottom:25px; font-size:16px; letter-spacing:1px;}
        h1 {text-align:center; margin-bottom:35px; color:#d6336c; font-family:'Great Vibes', cursive; font-size:42px; font-weight:normal;}
        p {line-height:1.9; text-align:center; margin-bottom:45px; font-size:19px; color:#7a3b64; font-weight:500;}
        .tombol-bawah {display:flex; justify-content:center; margin-top:25px;}
        button {
            padding:15px 45px; border-radius:50px; background:linear-gradient(135deg,#ff6b81,#ff4757); color:white;
            border:none; font-size:18px; font-weight:600; cursor:pointer; transition:0.4s ease; box-shadow:0 5px 15px rgba(255,71,87,0.3); font-family:'Quicksand', sans-serif;
            position:relative; overflow:visible;
        }
        button:active {transform:scale(0.95);}
        .hati {
            position:fixed; font-size:22px; color:#ff4757;
            animation:jatuh 5s linear infinite; pointer-events:none; opacity:0.7;
        }
        @keyframes jatuh {
            0% {transform:translateY(-10px) rotate(0deg); opacity:0.7;}
            100% {transform:translateY(100vh) rotate(360deg); opacity:0;}
        }
        .emoji-efek {
            position:fixed; font-size:24px; pointer-events:none; z-index:999;
            animation:melayang 1.2s ease-out forwards;
        }
        @keyframes melayang {
            0% {opacity:1; transform:translate(0,0) scale(0.5);}
            50% {opacity:1; transform:translate(var(--tx),var(--ty)) scale(1.2);}
            100% {opacity:0; transform:translate(var(--tx),calc(var(--ty) - 50px)) scale(0.8) rotate(360deg);}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="urutan">Langkah 1 dari 4</div>
    <h1>❤️ Khusus Buat Kamu ❤️</h1>
    <p>Halo sayangku! Selamat datang di halaman yang aku buat khusus cuma buat kamu lho.</p>
    <p>Baca pelan-pelan ya sayang, ayo kita lanjut ke halaman berikutnya 😘</p>

    <div class="tombol-bawah">
        <button onclick="munculEfek(event); setTimeout(()=>window.location.href='game.html', 1000)">Lanjut →</button>
    </div>
</div>

<script>
const emojiBagus = ['💖','✨','🥰','💫','🌸','💝','🎀','🦋','🌷','🧸','💌','🍓','🎈','🎊','💗','💓','💞','🌺','🐇','☁️'];

function munculEfek(e){
    let rect = e.target.getBoundingClientRect();
    let xPusat = rect.left + rect.width/2;
    let yPusat = rect.top + rect.height/2;
    
    for(let i=0; i<25; i++){
        let em = document.createElement('div');
        em.classList.add('emoji-efek');
        em.textContent = emojiBagus[Math.floor(Math.random()*emojiBagus.length)];
        em.style.left = xPusat + 'px';
        em.style.top = yPusat + 'px';
        let tx = (Math.random()-0.5)*250;
        let ty = (Math.random()-0.5)*250;
        em.style.setProperty('--tx', tx+'px');
        em.style.setProperty('--ty', ty+'px');
        document.body.appendChild(em);
        setTimeout(()=>em.remove(), 1200);
    }
}

setInterval(()=>{
    let h=document.createElement("div"); h.classList.add("hati"); h.textContent="❤️";
    h.style.left=Math.random()*100+"vw"; h.style.animationDuration=(Math.random()*3+4)+"s";
    document.body.appendChild(h); setTimeout(()=>h.remove(),7000);
},800);
</script>
</body>
</html>
